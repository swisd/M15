[package]
name = "emulator-gui"
version = "0.1.0"
edition = "2024"
authors = ["M15 Developers"]
description = "Desktop GUI emulator and debugging environment with architecture-aware stack viewer"
license = "MIT OR Apache-2.0"

[dependencies]
emulator-core = { path = "../emulator-core", features = ["all-arch", "std"] }
emulator-stack-viewer = { path = "../emulator-stack-viewer", features = ["egui", "std"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"

[[bin]]
name = "emulator-gui"
path = "src/main.rs"

[lib]
name = "emulator_gui"
path = "src/lib.rs"
